<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: #1e293b;
            min-height: 100vh;
        }
        .hero {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            padding: 50px 20px 70px;
            text-align: center;
            color: white;
        }
        .hero h1 { font-size: 32px; font-weight: 700; }
        .hero p { margin-top: 8px; opacity: 0.85; font-size: 15px; }

        .container {
            max-width: 720px;
            margin: -40px auto 40px;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 14px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        textarea:focus { outline: none; border-color: #7c3aed; }

        button {
            margin-top: 14px;
            padding: 12px 28px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover { background: #6d28d9; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }

        .error {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 32px 0 16px;
        }
        .results-header h2 { color: white; font-size: 20px; }

        #download-btn {
            background: #059669;
            padding: 9px 18px;
            font-size: 14px;
        }
        #download-btn:hover { background: #047857; }

        .question {
            background: white;
            padding: 20px;
            margin-bottom: 14px;
            border-radius: 12px;
            border-left: 4px solid #7c3aed;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .question .q-number {
            display: inline-block;
            background: #ede9fe;
            color: #7c3aed;
            font-weight: 700;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .question p.q-text { font-weight: 600; font-size: 16px; margin-bottom: 12px; color: #1e293b; }
        .option {
            padding: 9px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 14.5px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .option.correct {
            background: #ecfdf5;
            border-color: #6ee7b7;
            color: #047857;
            font-weight: 600;
        }
        .option.correct::after { content: " ✓"; }

        #loading {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            color: #64748b;
            font-size: 14px;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 3px solid #e2e8f0;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .hero h1 { font-size: 24px; }
            .container { margin-top: -30px; }
            .card { padding: 16px; }
            .results-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }

        @media print {
            .hero, form, #download-btn { display: none; }
            body { background: white; }
            .question { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>🧠 Quiz Generator</h1>
        <p>Paste a paragraph or topic and get an instant multiple-choice quiz</p>
    </div>

    <div class="container">
        <div class="card">
            <form id="quiz-form">
                <textarea id="text-input" placeholder="Paste a paragraph, or describe a topic in a few sentences..."></textarea><br>
                <button type="submit" id="submit-btn">Generate Quiz</button>
            </form>

            <div id="loading">
                <div class="spinner"></div>
                <span>Generating your quiz... this can take 10–30 seconds</span>
            </div>

            <div id="error-box"></div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
        const csrftoken = getCookie('csrftoken');

        const form = document.getElementById('quiz-form');
        const textInput = document.getElementById('text-input');
        const submitBtn = document.getElementById('submit-btn');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('error-box');
        const results = document.getElementById('results');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const text = textInput.value.trim();
            errorBox.innerHTML = '';
            results.innerHTML = '';

            if (!text) {
                errorBox.innerHTML = '<div class="error">Please paste some text first.</div>';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Generating...';
            loading.style.display = 'flex';

            try {
                const response = await fetch('/api/generate-quiz/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorBox.innerHTML = `<div class="error">${data.error || "Couldn't generate questions from this text — try a longer or more detailed paragraph."}</div>`;
                    return;
                }

                if (!data.questions || data.questions.length === 0) {
                    errorBox.innerHTML = '<div class="error">Couldn\'t generate questions from this text — try a longer or more detailed paragraph.</div>';
                    return;
                }

                let html = `<div class="results-header">
                                <h2>Your Quiz (${data.questions.length} question${data.questions.length === 1 ? '' : 's'})</h2>
                                <button id="download-btn" onclick="window.print()">⬇ Download PDF</button>
                             </div>`;

                data.questions.forEach((q, i) => {
                    html += `<div class="question"><span class="q-number">QUESTION ${i + 1}</span>
                              <p class="q-text">${q.question_text}</p>`;
                    q.options.forEach(opt => {
                        const correctClass = opt.is_correct ? 'correct' : '';
                        html += `<div class="option ${correctClass}">${opt.option_text}</div>`;
                    });
                    html += `</div>`;
                });

                results.innerHTML = html;

            } catch (err) {
                errorBox.innerHTML = `<div class="error">Request failed: ${err}</div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate Quiz';
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
